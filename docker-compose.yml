# One-command bring-up of the whole system: Postgres + backend + frontend.
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warroom}
      POSTGRES_USER: ${DB_USERNAME:-warroom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-warroom}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-warroom} -d ${POSTGRES_DB:-warroom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      R2DBC_URL: r2dbc:postgresql://db:5432/${POSTGRES_DB:-warroom}
      JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-warroom}
      DB_USERNAME: ${DB_USERNAME:-warroom}
      DB_PASSWORD: ${DB_PASSWORD:-warroom}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-this-must-be-at-least-32-bytes-long}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LLM_PROVIDER: ${LLM_PROVIDER:-template}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
      VITE_WS_BASE: ${VITE_WS_BASE:-ws://localhost:8080}
    ports:
      - "5173:5173"

volumes:
  pgdata:
